name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
        build_type: [Debug, Release]
        exclude:
          - compiler: clang++
            build_type: Debug
    name: ${{ matrix.compiler }} ${{ matrix.build_type }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.compiler }} cmake
      - name: Configure CMake
        run: cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build -- -j$(nproc)
      - name: Run executable
        run: ./build/pacterm
        continue-on-error: true

  build-make:
    runs-on: ubuntu-latest
    name: Make Build
    steps:
      - uses: actions/checkout@v4
      - name: Build with Make
        run: make
      - name: Run executable
        run: ./pacterm
        continue-on-error: true

  clang-format:
    runs-on: ubuntu-latest
    name: Code Format Check
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: clang-format --dry-run --Werror src/*.cpp src/*.hpp

  clang-tidy:
    runs-on: ubuntu-latest
    name: Static Analysis
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Configure CMake
        run: cmake -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run clang-tidy
        run: clang-tidy src/*.cpp -p build -- -std=c++20 -Isrc