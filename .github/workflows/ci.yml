name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        build_type: [Debug, Release]
        exclude:
          - compiler: clang++
            build_type: Debug
    name: ${{ matrix.compiler }} ${{ matrix.build_type }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ clang cmake make
      - name: Configure CMake
        run: cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --parallel "$(nproc)"
      - name: Run executable
        run: ./build/pacterm --version

  build-make:
    runs-on: ubuntu-24.04
    name: Make Build
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make
      - name: Build with Make
        run: make -j"$(nproc)"
      - name: Run executable
        run: ./pacterm --version

  clang-format:
    runs-on: ubuntu-24.04
    name: Code Format Check
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format
      - name: Check formatting
        run: clang-format --dry-run --Werror src/*.cpp src/*.hpp

  clang-tidy:
    runs-on: ubuntu-24.04
    name: Static Analysis
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang clang-tidy cmake make
      - name: Configure CMake
        run: cmake -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run clang-tidy
        run: clang-tidy src/*.cpp -p build --checks='clang-diagnostic-*,clang-analyzer-*' --quiet -- -std=c++23 -Isrc
